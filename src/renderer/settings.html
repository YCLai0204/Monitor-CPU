<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self';" />
  <title>Monitor-CPU 設定</title>
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <header class="top">
    <div class="title">
      <h1>Monitor-CPU</h1>
      <span class="version" id="version"></span>
    </div>
    <div class="live" aria-live="polite">
      <div class="meter">
        <span class="meter-name">CPU</span>
        <span class="meter-value" id="cpu-value">—</span>
        <span class="meter-bar"><span id="cpu-bar"></span></span>
      </div>
      <div class="meter">
        <span class="meter-name">GPU</span>
        <span class="meter-value" id="gpu-value">—</span>
        <span class="meter-bar"><span id="gpu-bar"></span></span>
      </div>
    </div>
  </header>

  <main>
    <section class="card">
      <h2>吉祥物</h2>
      <div class="row">
        <label class="row-label" for="mascot">角色</label>
        <select id="mascot"></select>
      </div>
      <div class="row">
        <label class="row-label" for="scale">大小</label>
        <div class="range">
          <input type="range" id="scale" min="0.6" max="1.6" step="0.05" />
          <output id="scale-out"></output>
        </div>
      </div>
      <div class="row">
        <span class="row-label">跟著誰動</span>
        <div class="seg" data-key="source">
          <button type="button" data-value="cpu">CPU</button>
          <button type="button" data-value="gpu">GPU</button>
          <button type="button" data-value="max">取較高</button>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>活動範圍</h2>
      <label class="check">
        <input type="checkbox" data-key="roamScreen" />
        <span>
          <strong>可以在整個畫面活動</strong>
          <small id="roam-desc"></small>
        </span>
      </label>
      <label class="check sub" id="perch-row">
        <input type="checkbox" data-key="perchWindows" />
        <span>
          <strong id="perch-title"></strong>
          <small id="perch-desc"></small>
        </span>
      </label>
    </section>

    <section class="card">
      <h2>顯示</h2>
      <label class="check">
        <input type="checkbox" data-key="showLabel" />
        <span>
          <strong>一直顯示數值標籤</strong>
          <small>關掉的話，滑鼠移到吉祥物身上才會出現</small>
        </span>
      </label>
      <label class="check">
        <input type="checkbox" data-key="showCrab" />
        <span>
          <strong>在桌面顯示吉祥物</strong>
          <small id="showCrab-note"></small>
        </span>
      </label>
      <label class="check">
        <input type="checkbox" data-key="showTray" />
        <span>
          <strong>在右下角顯示小圖示</strong>
          <small id="showTray-note"></small>
        </span>
      </label>
      <div class="row">
        <label class="row-label" for="display">顯示在螢幕</label>
        <select id="display"></select>
      </div>
    </section>

    <section class="card">
      <h2>效能</h2>
      <div class="row">
        <span class="row-label">繪圖方式</span>
        <div class="seg" data-key="renderMode">
          <button type="button" data-value="auto">自動</button>
          <button type="button" data-value="cpu">省 GPU</button>
          <button type="button" data-value="gpu">用顯示卡</button>
        </div>
      </div>
      <p class="hint" id="render-info"></p>
      <div class="buttons" id="relaunch-row" hidden>
        <button type="button" class="btn" id="relaunch">重新啟動套用</button>
      </div>
    </section>

    <section class="card">
      <h2>系統</h2>
      <label class="check">
        <input type="checkbox" data-key="startOnLogin" />
        <span>
          <strong>開機時自動啟動</strong>
          <small>登入 Windows 後自動開啟，不用自己點</small>
        </span>
      </label>
      <div class="buttons">
        <button type="button" class="btn" id="temp-help">溫度顯示 N/A？</button>
        <button type="button" class="btn danger" id="quit">離開程式</button>
      </div>
    </section>
    <section class="card" id="egg-test" hidden>
      <h2>彩蛋測試（開發用）</h2>
      <p class="hint">只有用 npm start 執行時才會出現，打包後的 exe 看不到。</p>
      <div class="buttons">
        <button type="button" class="btn" data-egg="dizzy">連點 5 下</button>
        <button type="button" class="btn" data-egg="shake">用力甩</button>
        <button type="button" class="btn" data-egg="rest">休息提醒</button>
        <button type="button" class="btn" data-egg="faint">滿載累倒</button>
        <button type="button" class="btn" data-egg="holiday">節日預覽（輪流切換）</button>
        <button type="button" class="btn" data-egg="feast">黑熊吃鮭魚</button>
        <button type="button" class="btn" data-egg="hatch">魚卵立刻孵化</button>
        <button type="button" class="btn" data-egg="scoop">琵鷺撈螃蟹</button>
        <button type="button" class="btn" data-egg="friends">綠蠵龜和白海豚</button>
      </div>
    </section>
  </main>

  <footer class="foot">設定會自動儲存。關掉這個視窗不會結束程式。</footer>

  <script src="settings.js"></script>
</body>
</html>
